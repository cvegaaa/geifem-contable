name: CI

on:
  push:
    branches: [main, desarrollo]
  pull_request:

jobs:
  backend:
    name: Backend (pruebas)
    runs-on: ubuntu-latest
    env:
      MONGO_URI: mongodb://localhost:27017/?directConnection=true
    steps:
      - uses: actions/checkout@v4

      # Las transacciones requieren un replica set.
      - name: MongoDB (replica set de un nodo)
        run: |
          docker run -d --name mongo -p 27017:27017 mongo:8.0 --replSet rs0 --bind_ip_all
          for i in $(seq 1 30); do
            docker exec mongo mongosh --quiet --eval 'db.runCommand({ping:1}).ok' && break || sleep 2
          done
          docker exec mongo mongosh --quiet --eval 'rs.initiate({_id:"rs0",members:[{_id:0,host:"localhost:27017"}]})'
          for i in $(seq 1 30); do
            docker exec mongo mongosh --quiet --eval 'rs.status().myState' | grep -q '^1$' && break || sleep 2
          done

      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"
          cache: pip
          cache-dependency-path: backend/requirements-dev.txt

      - name: Instalar dependencias
        working-directory: backend
        run: pip install -r requirements-dev.txt

      - name: Pruebas
        working-directory: backend
        run: python -m pytest -q

  frontend:
    name: Frontend (compilación y auditoría)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Instalar
        working-directory: frontend
        run: npm ci
      - name: Compilar
        working-directory: frontend
        run: npm run build
      - name: Auditar dependencias
        working-directory: frontend
        run: npm audit --audit-level=high

  imagenes:
    name: Imágenes Docker
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Construir imágenes
        run: |
          docker build -t geifem-mongo infra/mongo
          docker build -t geifem-respaldo infra/respaldo
          docker build -t geifem-backend backend
          docker build -t geifem-frontend frontend
